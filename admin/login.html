<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Вход — админка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #12110f; --card: #1c1a17; --text: #f4f1ea; --muted: #9a9488;
      --accent: #d4b36a; --danger: #c45c5c; --line: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, rgba(212,179,106,0.12), transparent 50%), var(--bg);
      color: var(--text); display: grid; place-items: center; padding: 24px;
    }
    .box {
      width: min(100%, 400px); background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 28px 24px;
    }
    h1 { margin: 0 0 6px; font-size: 1.25rem; }
    p { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: #14120f; color: var(--text); font-size: 1rem;
    }
    button {
      width: 100%; margin-top: 12px; padding: 12px 14px; border: 0; border-radius: 10px;
      background: var(--accent); color: #1a150c; font-weight: 600; cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button:disabled { opacity: 0.6; }
    .err { margin-top: 12px; color: var(--danger); font-size: 0.85rem; min-height: 1.2em; }
    .or { text-align: center; color: var(--muted); font-size: 0.8rem; margin: 14px 0 4px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>КнязьMobile</h1>
    <p>Служебный вход</p>
    <form id="form">
      <label for="password">Пароль</label>
      <input id="password" type="password" required autocomplete="current-password" />
      <button type="submit" id="btn">Войти</button>
    </form>
    <div class="or">или</div>
    <button type="button" class="ghost" id="tg-btn">Войти через Telegram</button>
    <div class="err" id="err"></div>
  </div>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { try { tg.ready(); tg.expand(); } catch (_) {} }
    const err = document.getElementById("err");
    const base = location.pathname.replace(/\/?$/, "");

    async function post(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "Ошибка");
      return data;
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      const btn = document.getElementById("btn");
      btn.disabled = true;
      try {
        const data = await post(base + "/login", { password: document.getElementById("password").value });
        location.href = data.redirect || base + "/app";
      } catch (ex) {
        err.textContent = ex.message;
        btn.disabled = false;
      }
    });

    document.getElementById("tg-btn").addEventListener("click", async () => {
      err.textContent = "";
      const init = tg?.initData || "";
      if (!init) {
        err.textContent = "Откройте эту страницу как Mini App бота (или войдите паролем).";
        return;
      }
      try {
        const data = await post(base + "/login/telegram", { init_data: init });
        location.href = data.redirect || base + "/app";
      } catch (ex) {
        err.textContent = ex.message;
      }
    });

    // Auto Telegram login if opened inside WebApp
    if (tg?.initData) {
      document.getElementById("tg-btn").click();
    }
  </script>
</body>
</html>
