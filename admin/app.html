<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Заявки — КнязьMobile</title>
  <style>
    :root {
      --bg: #12110f;
      --card: #1c1a17;
      --text: #f4f1ea;
      --muted: #9a9488;
      --accent: #d4b36a;
      --line: rgba(255,255,255,0.08);
      --ok: #6a9f7a;
      --warn: #c9a24d;
      --bad: #c45c5c;
      --info: #6a8fb8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(18,17,15,0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    header h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
    }
    header .meta { color: var(--muted); font-size: 0.85rem; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button, select, input {
      font: inherit;
      color: var(--text);
      background: #171511;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
    }
    button { cursor: pointer; }
    button.primary {
      background: var(--accent);
      color: #1a150c;
      border-color: transparent;
      font-weight: 600;
    }
    button.ghost { background: transparent; }
    main { padding: 16px; max-width: 960px; margin: 0 auto; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .toolbar input { flex: 1 1 180px; min-width: 140px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
    }
    .chip.active {
      color: #1a150c;
      background: var(--accent);
      border-color: transparent;
      font-weight: 600;
    }
    .list { display: grid; gap: 10px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .card h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .badge {
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 999px;
      white-space: nowrap;
      font-weight: 600;
    }
    .badge.new { background: rgba(201,162,77,0.2); color: var(--warn); }
    .badge.in_progress { background: rgba(106,143,184,0.2); color: var(--info); }
    .badge.done { background: rgba(106,159,122,0.2); color: var(--ok); }
    .badge.cancelled { background: rgba(196,92,92,0.2); color: var(--bad); }
    .row { color: var(--muted); font-size: 0.88rem; margin: 4px 0; }
    .row strong { color: var(--text); font-weight: 500; }
    .phone { font-family: ui-monospace, Consolas, monospace; }
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .card-actions button { font-size: 0.8rem; padding: 6px 10px; }
    .empty, .error {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
    }
    .error { color: var(--bad); }
    a.tel { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Заявки</h1>
      <div class="meta" id="meta">Загрузка…</div>
    </div>
    <div class="actions">
      <button type="button" class="ghost" id="refresh">Обновить</button>
      <button type="button" class="ghost" id="logout">Выйти</button>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Телефон, товар, имя…" />
      <button type="button" class="primary" id="search">Найти</button>
    </div>
    <div class="chips" id="status-chips"></div>
    <div class="list" id="list" style="margin-top:14px"></div>
  </main>
  <script>
    const STATUS_LABELS = {
      new: "Новая",
      in_progress: "В работе",
      done: "Готово",
      cancelled: "Отмена",
    };
    const state = { status: "new", q: "", statuses: Object.keys(STATUS_LABELS) };
    const els = {
      list: document.getElementById("list"),
      meta: document.getElementById("meta"),
      chips: document.getElementById("status-chips"),
      q: document.getElementById("q"),
    };

    function basePath() {
      // /a/SECRET/app → /a/SECRET
      return location.pathname.replace(/\/app\/?$/, "");
    }

    function fmtDate(iso) {
      try {
        return new Date(iso).toLocaleString("ru-RU", {
          day: "2-digit", month: "2-digit", year: "2-digit",
          hour: "2-digit", minute: "2-digit",
        });
      } catch (_) {
        return iso;
      }
    }

    function priceText(price) {
      if (!price || price <= 0) return "уточнит менеджер";
      return Number(price).toLocaleString("ru-RU") + " BYN";
    }

    function renderChips() {
      const all = [{ id: "", title: "Все" }].concat(
        state.statuses.map((id) => ({ id, title: STATUS_LABELS[id] || id }))
      );
      els.chips.innerHTML = all
        .map(
          (c) =>
            `<button type="button" class="chip ${state.status === c.id ? "active" : ""}" data-status="${c.id}">${c.title}</button>`
        )
        .join("");
    }

    function renderOrders(items, total) {
      els.meta.textContent = total ? `Показано ${items.length} из ${total}` : "Пусто";
      if (!items.length) {
        els.list.innerHTML = `<div class="empty">Заявок нет</div>`;
        return;
      }
      els.list.innerHTML = items
        .map((o) => {
          const st = o.status || "new";
          const tg = o.telegram_username
            ? `@${o.telegram_username}`
            : o.telegram_full_name || "—";
          const buttons = state.statuses
            .filter((s) => s !== st)
            .map(
              (s) =>
                `<button type="button" data-id="${o.id}" data-set="${s}">${STATUS_LABELS[s] || s}</button>`
            )
            .join("");
          return `
            <article class="card">
              <div class="card-top">
                <h2>#${o.id} · ${o.product_name || "—"}</h2>
                <span class="badge ${st}">${STATUS_LABELS[st] || st}</span>
              </div>
              <div class="row">${o.color_name || "—"} · ${o.storage || "—"} · <strong>${priceText(o.price)}</strong></div>
              <div class="row">Оплата: ${o.payment_title || "—"}</div>
              <div class="row">Телефон: <a class="tel phone" href="tel:${o.phone}">${o.phone}</a></div>
              <div class="row">Клиент: ${tg}</div>
              <div class="row">${fmtDate(o.created_at)}</div>
              <div class="card-actions">${buttons}</div>
            </article>`;
        })
        .join("");
    }

    async function load() {
      els.list.innerHTML = `<div class="empty">Загрузка…</div>`;
      const params = new URLSearchParams();
      if (state.status) params.set("status", state.status);
      if (state.q) params.set("q", state.q);
      params.set("limit", "80");
      try {
        const res = await fetch(`${basePath()}/api/orders?${params}`, {
          credentials: "same-origin",
        });
        if (res.status === 401) {
          location.href = basePath() + "/";
          return;
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Ошибка");
        if (Array.isArray(data.statuses) && data.statuses.length) {
          state.statuses = data.statuses;
        }
        renderChips();
        renderOrders(data.items || [], data.total || 0);
      } catch (ex) {
        els.list.innerHTML = `<div class="error">${ex.message || "Ошибка загрузки"}</div>`;
        els.meta.textContent = "Ошибка";
      }
    }

    async function setStatus(id, status) {
      const res = await fetch(`${basePath()}/api/orders/${id}`, {
        method: "PATCH",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status }),
      });
      if (res.status === 401) {
        location.href = basePath() + "/";
        return;
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "Не удалось обновить");
      await load();
    }

    els.chips.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-status]");
      if (!btn) return;
      state.status = btn.dataset.status;
      renderChips();
      load();
    });

    els.list.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-set]");
      if (!btn) return;
      btn.disabled = true;
      try {
        await setStatus(btn.dataset.id, btn.dataset.set);
      } catch (ex) {
        alert(ex.message || "Ошибка");
        btn.disabled = false;
      }
    });

    document.getElementById("search").addEventListener("click", () => {
      state.q = els.q.value.trim();
      load();
    });
    els.q.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        state.q = els.q.value.trim();
        load();
      }
    });
    document.getElementById("refresh").addEventListener("click", load);
    document.getElementById("logout").addEventListener("click", async () => {
      await fetch(basePath() + "/logout", { method: "POST", credentials: "same-origin" });
      location.href = basePath() + "/";
    });

    renderChips();
    load();
  </script>
</body>
</html>
