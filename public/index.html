<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>КнязьMobile</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=20260801brand" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <img src="/images/brand.png" alt="" width="52" height="52" />
        </span>
        <div>
          <div class="brand-name"><span class="knyaz">Князь</span><span class="mobile">mobile</span></div>
          <div class="brand-sub">техника · рассрочка · доставка</div>
        </div>
      </div>
    </header>

    <nav id="categories" class="cats" aria-label="Категории"></nav>

    <main id="list-view" class="view">
      <div id="product-list" class="grid"></div>
    </main>

    <main id="detail-view" class="view hidden">
      <button type="button" class="back" id="back-btn">← Назад</button>
      <section class="detail">
        <div class="media" id="detail-media">
          <img id="detail-image" alt="" />
          <div class="media-glow" id="detail-glow"></div>
        </div>
        <div class="detail-head">
          <div id="detail-badge" class="badge hidden"></div>
          <h1 id="detail-name"></h1>
          <p id="detail-note" class="muted"></p>
          <p id="detail-gift" class="gift hidden"></p>
        </div>

        <div class="block">
          <div class="block-label">Цвет</div>
          <div id="color-list" class="colors"></div>
          <div id="color-name" class="choice-caption"></div>
        </div>

        <div class="block">
          <div class="block-label">Память</div>
          <div id="storage-list" class="configs"></div>
        </div>

        <div class="block" id="sim-block">
          <div class="block-label">SIM-карта</div>
          <div id="sim-list" class="configs"></div>
          <div id="sim-name" class="choice-caption"></div>
        </div>

        <div class="price-row">
          <div>
            <div class="block-label">Цена</div>
            <div id="detail-price" class="price">—</div>
          </div>
          <div id="detail-stock" class="stock"></div>
        </div>

        <div class="block">
          <div class="block-label">Оплата</div>
          <div id="payment-list" class="payments"></div>
          <div id="payment-name" class="choice-caption"></div>
        </div>

        <label class="field">
          <span class="block-label">Телефон</span>
          <input
            id="phone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            placeholder="+375 XX XXX XX XX"
            maxlength="17"
            enterkeyhint="done"
          />
          <span class="fineprint" id="phone-hint">Только цифры, номер РБ: +375 и 9 цифр</span>
        </label>

        <button type="button" class="cta" id="order-btn">Оставить заявку</button>
        <p class="fineprint">Цена зависит от памяти и типа SIM. Менеджер подтвердит наличие выбранного цвета.</p>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="/script.js?v=20260819hybrid"></script>
</body>
</html>
